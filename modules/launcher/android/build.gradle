plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.launcher'
version = '1.0.0'

android {
  namespace "expo.modules.launcher"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // LockScreenActivity hosts a React Native screen; the version comes from the app's React Native.
  implementation 'com.facebook.react:react-android'
}
