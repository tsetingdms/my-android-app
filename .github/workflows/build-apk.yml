name: Build APK

on:
  push:
    branches: [main]
    # Docs-only changes don't need a new APK.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_NAME: lumo-launcher.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        # The Expo template signs release builds with the bundled debug keystore,
        # so the APK installs directly on a phone. ARM only keeps it small.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Verify signature
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "dist/$APK_NAME"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumo-launcher-apk
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" "dist/$APK_NAME" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Lumo Launcher $TAG" \
            --latest \
            --notes "Download **$APK_NAME** below on your Android phone and open it to install (allow \"Install unknown apps\" when asked). Built from ${{ github.sha }} on ${{ github.ref_name }}."
